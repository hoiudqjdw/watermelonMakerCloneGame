<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수박게임 클론</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background: #fdf6e3;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .app {
    width: max-content;
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  h1 {
    margin: 0 0 16px;
    color: #c0392b;
  }

  .mode-panel {
    position: relative;
    z-index: 1000;
    display: block;
    width: min(556px, 100%);
    min-height: 112px;
    margin: 16px auto;
    padding: 14px;
    background: #fff;
    border: 3px solid #222;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
  }

  .mode-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .mode-heading strong {
    color: #222;
    font-size: 17px;
  }

  .mode-status {
    color: #555;
    font-size: 14px;
    font-weight: bold;
  }

  .game-wrap {
    display: flex;
    gap: 16px;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 140px;
  }

  .panel-box {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  }

  .panel-label {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
  }

  .score-value {
    font-size: 28px;
    font-weight: bold;
    color: #c0392b;
  }

  .next-preview {
    font-size: 40px;
    line-height: 1;
  }

  .restart-btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #c0392b;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }

  .restart-btn:hover {
    background: #a93226;
  }

  .canvas-wrap {
    position: relative;
  }

  #game-canvas {
    background: #fffdf5;
    border: 3px solid #c0392b;
    border-radius: 8px;
    touch-action: none;
    cursor: pointer;
  }

  .game-over {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    z-index: 10;
  }

  .game-over.hidden {
    display: none;
  }

  .game-over-box {
    background: #fff;
    border-radius: 12px;
    padding: 24px 32px;
    text-align: center;
  }

  .game-over-box h2 {
    margin-top: 0;
    color: #c0392b;
  }

  .mode-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .mode-btn {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 13px 16px;
    border: 0;
    border-radius: 10px;
    color: #fff;
    background: #c0392b;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .mode-btn.special {
    background: #6c5ce7;
  }

  .mode-btn.bouncy {
    background: #0984e3;
  }

  .mode-btn.active {
    outline: 4px solid rgba(241, 196, 15, 0.75);
    transform: translateY(-1px);
  }

  @media (max-width: 620px) {
    .app {
      width: 100%;
      padding: 12px;
    }

    .game-wrap {
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .side-panel {
      width: min(400px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .restart-btn {
      grid-column: 1 / -1;
    }

    .canvas-wrap,
    #game-canvas {
      width: min(400px, 100%);
    }

    #game-canvas {
      height: auto;
    }

    .mode-panel {
      width: min(400px, 100%);
    }

    .mode-heading {
      align-items: flex-start;
      flex-direction: column;
      gap: 3px;
    }

    .mode-buttons {
      grid-template-columns: 1fr;
    }
  }

  .mode-description {
    margin: 0 0 16px;
    color: #666;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <section class="mode-panel" aria-label="게임 모드 선택">
    <div class="mode-heading">
      <strong>게임 모드 선택</strong>
      <span id="mode-status" class="mode-status" aria-live="polite">현재 모드: 일반</span>
    </div>
    <div class="mode-buttons">
      <button id="normal-mode-btn" class="mode-btn active" type="button" aria-pressed="true">일반 모드</button>
      <button id="special-mode-btn" class="mode-btn special" type="button" aria-pressed="false">특수 모드</button>
      <button id="bouncy-mode-btn" class="mode-btn bouncy" type="button" aria-pressed="false">튕김 모드</button>
    </div>
  </section>

  <div id="game-app" class="app">
    <h1>수박게임</h1>

    <div class="game-wrap">
      <div class="side-panel">
        <div class="panel-box">
          <span class="panel-label">점수</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="panel-box">
          <span class="panel-label">다음 과일</span>
          <div id="next-preview" class="next-preview"></div>
        </div>
        <button id="restart-btn" class="restart-btn">재시작</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="game-over" class="game-over hidden">
          <div class="game-over-box">
            <h2>게임 오버</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button id="game-over-restart-btn" class="restart-btn">다시 시작</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 수박게임 클론 - 순수 JS 물리 구현 (라이브러리 없음)

    const FRUITS = [
      { name: "체리",     emoji: "🍒", radius: 14, color: "#e74c3c", score: 1 },
      { name: "딸기",     emoji: "🍓", radius: 20, color: "#ff6b81", score: 3 },
      { name: "포도",     emoji: "🍇", radius: 26, color: "#8e44ad", score: 6 },
      { name: "귤",       emoji: "🍊", radius: 32, color: "#f39c12", score: 10 },
      { name: "레몬",     emoji: "🍋", radius: 38, color: "#f4d03f", score: 15 },
      { name: "사과",     emoji: "🍎", radius: 44, color: "#e74c3c", score: 21 },
      { name: "배",       emoji: "🍐", radius: 50, color: "#a3cb38", score: 28 },
      { name: "복숭아",   emoji: "🍑", radius: 58, color: "#ffb8b8", score: 36 },
      { name: "파인애플", emoji: "🍍", radius: 66, color: "#f9ca24", score: 45 },
      { name: "멜론",     emoji: "🍈", radius: 76, color: "#78e08f", score: 55 },
      { name: "수박",     emoji: "🍉", radius: 88, color: "#2ecc71", score: 66 },
    ];

    const SPECIAL_BALLS = {
      bomb: { name: "폭탄", emoji: "💣", radius: 25, color: "#2d3436" },
      superCherry: { name: "슈퍼체리", emoji: "✨", radius: 23, color: "#fd79a8" },
      heavy: { name: "고중력", emoji: "🪐", radius: 24, color: "#6c5ce7" },
    };
    const SPECIAL_TYPES = Object.keys(SPECIAL_BALLS);
    const SPECIAL_DROP_CHANCE = 0.22;

    const MAX_DROP_TIER = 4; // 처음 떨어뜨릴 수 있는 과일은 체리~레몬 중에서만 등장
    const GRAVITY = 900; // px/s^2
    const WALL_DAMPING = 0.5;
    const RESTITUTION = 0.15;
    const AIR_FRICTION = 0.995;
    const MAX_SPEED = 1200; // px/s, 겹침 보정이 겹쳐서 폭발하듯 튕기는 것을 방지
    const MAX_CORRECTION_PER_STEP = 6; // px, 완전히 겹친 과일도 한 프레임에 순간이동하지 않도록 제한
    const COLLISION_ITERATIONS = 4; // 여러 과일이 동시에 맞닿았을 때 안정적으로 수렴시키기 위한 반복 횟수
    // 쌓여서 정지한 과일도 중력/반발 보정 때문에 매 프레임 완전히 0이 되지는 않고
    // 약 20~25px/s 정도의 잔류 진동이 남는다. 그보다 확실히 높은 값으로 "정지"를 판정한다.
    const SETTLED_SPEED_THRESHOLD = 40;
    const LINE_Y = 150; // 게임오버 판정선 (상단 모드 버튼 영역 아래)
    const DANGER_TIME_LIMIT = 1.2; // 초 단위, 이 시간 이상 라인 위에 머물면 게임오버
    const DROP_COOLDOWN = 0.35; // 초

    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById("score");
    const nextPreviewEl = document.getElementById("next-preview");
    const gameOverEl = document.getElementById("game-over");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");
    const gameOverRestartBtn = document.getElementById("game-over-restart-btn");
    const normalModeBtn = document.getElementById("normal-mode-btn");
    const specialModeBtn = document.getElementById("special-mode-btn");
    const bouncyModeBtn = document.getElementById("bouncy-mode-btn");
    const modeStatusEl = document.getElementById("mode-status");

    let fruits = [];
    let score = 0;
    let isGameOver = false;
    let dropCooldownTimer = 0;
    let idCounter = 0;
    let effects = [];
    let screenShake = 0;
    let audioContext = null;
    let gameMode = "normal";

    let currentDrop = randomDrop();
    let nextDrop = randomDrop();
    let pointerX = W / 2;

    function randomDropTier() {
      return Math.floor(Math.random() * MAX_DROP_TIER);
    }

    function randomDrop() {
      if (gameMode === "special" && Math.random() < SPECIAL_DROP_CHANCE) {
        return { kind: "special", type: SPECIAL_TYPES[Math.floor(Math.random() * SPECIAL_TYPES.length)] };
      }
      return { kind: "fruit", tier: randomDropTier() };
    }

    function getDropDefinition(drop) {
      return drop.kind === "fruit" ? FRUITS[drop.tier] : SPECIAL_BALLS[drop.type];
    }

    function createFruit(tier, x, y) {
      const def = FRUITS[tier];
      return {
        id: idCounter++,
        tier,
        x,
        y,
        // 완전히 같은 x좌표로만 계속 쌓이면 회전이 없는 원판 물리 특성상 무너지지 않고
        // 얇은 탑처럼 끝없이 올라가므로, 아주 작은 무작위 수평 속도로 그 완벽한 균형을 깬다.
        vx: (Math.random() - 0.5) * 8,
        vy: 0,
        radius: def.radius,
        dangerTime: 0,
        settled: false,
        spawnAge: 0,
        kind: "fruit",
        gravityMultiplier: 1,
      };
    }

    function createSpecialBall(type, x, y) {
      const def = SPECIAL_BALLS[type];
      return {
        id: idCounter++, kind: "special", specialType: type,
        x, y, vx: (Math.random() - 0.5) * 8, vy: 0,
        radius: def.radius, dangerTime: 0, settled: false, spawnAge: 0,
        gravityMultiplier: 1,
      };
    }

    // 별도 음원 파일 없이 Web Audio API로 짧은 효과음을 만든다.
    function getAudioContext() {
      if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        audioContext = new AudioContext();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playTone({ frequency, endFrequency, duration, volume, type = "sine" }) {
      const audio = getAudioContext();
      if (!audio) return;

      const now = audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(endFrequency, now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    }

    function playDropSound(tier) {
      playTone({
        frequency: 250 - tier * 14,
        endFrequency: 105 - tier * 4,
        duration: 0.13,
        volume: 0.055,
        type: "triangle",
      });
    }

    function playMergeSound(tier) {
      const base = 360 + tier * 55;
      playTone({
        frequency: base,
        endFrequency: base * 1.55,
        duration: 0.18,
        volume: 0.07,
        type: "sine",
      });
    }

    function createMergeEffect(x, y, tier, colorOverride = null) {
      const color = colorOverride || FRUITS[tier].color;
      effects.push({ type: "ring", x, y, age: 0, duration: 0.38, color });
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.25;
        const speed = 65 + Math.random() * 95;
        effects.push({
          type: "particle",
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 3,
          age: 0,
          duration: 0.35 + Math.random() * 0.18,
          color,
        });
      }
      screenShake = Math.min(7, 2.5 + tier * 0.45);
    }

    function updateEffects(dt) {
      for (const effect of effects) {
        effect.age += dt;
        if (effect.type === "particle") {
          effect.x += effect.vx * dt;
          effect.y += effect.vy * dt;
          effect.vy += 180 * dt;
        }
      }
      effects = effects.filter((effect) => effect.age < effect.duration);
      screenShake = Math.max(0, screenShake - 24 * dt);
    }

    function resetBoard() {
      fruits = [];
      score = 0;
      isGameOver = false;
      dropCooldownTimer = 0;
      idCounter = 0;
      effects = [];
      screenShake = 0;
      pointerX = W / 2;
      currentDrop = randomDrop();
      nextDrop = randomDrop();
      gameOverEl.classList.add("hidden");
      updateScoreUI();
      updateNextPreviewUI();
    }

    function changeMode(mode) {
      gameMode = mode;
      // 모드가 바뀌면 기존 점수와 모든 과일을 제거하고 새 판을 시작한다.
      resetBoard();
      const buttons = {
        normal: normalModeBtn,
        special: specialModeBtn,
        bouncy: bouncyModeBtn,
      };
      for (const [buttonMode, button] of Object.entries(buttons)) {
        const selected = gameMode === buttonMode;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      }
      const modeNames = { normal: "일반", special: "특수", bouncy: "튕김" };
      modeStatusEl.textContent = `현재 모드: ${modeNames[gameMode]}`;
    }

    function updateScoreUI() {
      scoreEl.textContent = score;
    }

    function updateNextPreviewUI() {
      nextPreviewEl.textContent = getDropDefinition(nextDrop).emoji;
    }

    // ---- 입력 처리 ----

    function getPointerPosition(evt) {
      const rect = canvas.getBoundingClientRect();
      const point = evt.touches?.[0] || evt.changedTouches?.[0] || evt;
      return {
        x: (point.clientX - rect.left) * (W / rect.width),
        y: (point.clientY - rect.top) * (H / rect.height),
      };
    }

    canvas.addEventListener("mousemove", (e) => {
      pointerX = getPointerPosition(e).x;
    });

    canvas.addEventListener("touchmove", (e) => {
      pointerX = getPointerPosition(e).x;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener("click", (e) => {
      const point = getPointerPosition(e);
      dropCurrentFruit(point.x);
    });

    canvas.addEventListener("touchend", (e) => {
      const point = getPointerPosition(e);
      dropCurrentFruit(point.x);
      e.preventDefault();
    }, { passive: false });

    function dropCurrentFruit(x) {
      if (isGameOver || dropCooldownTimer > 0) return;

      const def = getDropDefinition(currentDrop);
      const radius = def.radius;
      const clampedX = Math.max(radius, Math.min(W - radius, x));

      const dropped = currentDrop.kind === "fruit"
        ? createFruit(currentDrop.tier, clampedX, LINE_Y - radius - 10)
        : createSpecialBall(currentDrop.type, clampedX, LINE_Y - radius - 10);
      fruits.push(dropped);
      playDropSound(currentDrop.kind === "fruit" ? currentDrop.tier : 2);

      currentDrop = nextDrop;
      nextDrop = randomDrop();
      updateNextPreviewUI();
      dropCooldownTimer = DROP_COOLDOWN;
    }

    restartBtn.addEventListener("click", resetBoard);
    gameOverRestartBtn.addEventListener("click", resetBoard);
    normalModeBtn.addEventListener("click", () => changeMode("normal"));
    specialModeBtn.addEventListener("click", () => changeMode("special"));
    bouncyModeBtn.addEventListener("click", () => changeMode("bouncy"));

    window.addEventListener("keydown", (event) => {
      if ((event.code === "Space" || event.key === " ") && !event.repeat) {
        event.preventDefault();
        const modes = ["normal", "special", "bouncy"];
        changeMode(modes[(modes.indexOf(gameMode) + 1) % modes.length]);
      }
    });

    // ---- 물리 & 병합 ----

    function stepPhysics(dt) {
      const isBouncyMode = gameMode === "bouncy";
      for (const f of fruits) {
        f.spawnAge += dt;
        f.vy += GRAVITY * f.gravityMultiplier * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        if (!isBouncyMode) {
          f.vx *= AIR_FRICTION;
          f.vy *= AIR_FRICTION;
        }

        // 벽 충돌
        if (f.x - f.radius < 0) {
          f.x = f.radius;
          f.vx = Math.max(Math.abs(f.vx) * (isBouncyMode ? 0.98 : WALL_DAMPING), isBouncyMode ? 130 : 0);
        } else if (f.x + f.radius > W) {
          f.x = W - f.radius;
          f.vx = -Math.max(Math.abs(f.vx) * (isBouncyMode ? 0.98 : WALL_DAMPING), isBouncyMode ? 130 : 0);
        }

        // 바닥 충돌
        if (f.y + f.radius > H) {
          f.y = H - f.radius;
          if (isBouncyMode) {
            f.vy = -Math.max(Math.abs(f.vy) * 0.98, 300);
            if (Math.abs(f.vx) < 90) f.vx += Math.random() < 0.5 ? -140 : 140;
          } else {
            f.vy *= -WALL_DAMPING;
          }
        }

        const speed = Math.hypot(f.vx, f.vy);
        if (speed > MAX_SPEED) {
          f.vx *= MAX_SPEED / speed;
          f.vy *= MAX_SPEED / speed;
        }
      }

      handleSpecialCollisions();
      handleMerges();

      // 여러 과일이 동시에 맞닿아 쌓인 상태는 한 번의 보정 패스로는 수렴하지 않으므로
      // 같은 프레임 안에서 여러 번 반복 보정해 안정적으로 정지하게 한다.
      for (let iter = 0; iter < COLLISION_ITERATIONS; iter++) {
        resolveOverlaps();
      }

      for (const f of fruits) {
        const speed = Math.abs(f.vx) + Math.abs(f.vy);
        f.settled = gameMode !== "bouncy" && speed < SETTLED_SPEED_THRESHOLD;
      }
    }

    function handleSpecialCollisions() {
      const consumed = new Set();
      const spawned = [];

      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (consumed.has(a.id) || a.kind !== "special") continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (consumed.has(b.id)) continue;
          const dist = Math.hypot(b.x - a.x, b.y - a.y);
          if (dist >= a.radius + b.radius) continue;

          // 고중력 공은 닿은 과일에 흡수되어 그 과일의 중력을 강화한다.
          if (a.specialType === "heavy" && b.kind === "fruit") {
            consumed.add(a.id);
            b.gravityMultiplier = Math.min(5, b.gravityMultiplier + 2);
            createMergeEffect(b.x, b.y, b.tier, SPECIAL_BALLS.heavy.color);
            playMergeSound(3);
            break;
          }

          if (b.kind !== "special" || a.specialType !== b.specialType) continue;

          const x = (a.x + b.x) / 2;
          const y = (a.y + b.y) / 2;

          if (a.specialType === "bomb") {
            consumed.add(a.id);
            consumed.add(b.id);
            for (const fruit of fruits) {
              if (fruit.kind !== "fruit" || consumed.has(fruit.id)) continue;
              let dx = fruit.x - x;
              let dy = fruit.y - y;
              let distance = Math.hypot(dx, dy);
              if (distance < 1) {
                dx = Math.random() - 0.5;
                dy = -1;
                distance = Math.hypot(dx, dy);
              }
              const force = Math.max(220, 850 - distance * 2.2);
              fruit.vx += (dx / distance) * force;
              fruit.vy += (dy / distance) * force - 180;
              fruit.settled = false;
            }
            createMergeEffect(x, y, 0, SPECIAL_BALLS.bomb.color);
            screenShake = 10;
            playTone({ frequency: 135, endFrequency: 55, duration: 0.3, volume: 0.11, type: "sawtooth" });
            break;
          }

          if (a.specialType === "superCherry") {
            consumed.add(a.id);
            consumed.add(b.id);
            for (let k = 0; k < 10; k++) {
              const angle = (Math.PI * 2 * k) / 10;
              const cherry = createFruit(0, x + Math.cos(angle) * 50, y + Math.sin(angle) * 50);
              cherry.vx = Math.cos(angle) * 330;
              cherry.vy = Math.sin(angle) * 330 - 150;
              spawned.push(cherry);
            }
            createMergeEffect(x, y, 0, SPECIAL_BALLS.superCherry.color);
            screenShake = 8;
            playMergeSound(7);
            break;
          }
        }
      }

      // 순서가 반대인 경우에도 고중력 공의 흡수를 처리한다.
      for (const heavy of fruits) {
        if (consumed.has(heavy.id) || heavy.kind !== "special" || heavy.specialType !== "heavy") continue;
        const target = fruits.find((fruit) =>
          !consumed.has(fruit.id) && fruit.kind === "fruit" &&
          Math.hypot(fruit.x - heavy.x, fruit.y - heavy.y) < fruit.radius + heavy.radius
        );
        if (target) {
          consumed.add(heavy.id);
          target.gravityMultiplier = Math.min(5, target.gravityMultiplier + 2);
          createMergeEffect(target.x, target.y, target.tier, SPECIAL_BALLS.heavy.color);
          playMergeSound(3);
        }
      }

      if (consumed.size) {
        fruits = fruits.filter((fruit) => !consumed.has(fruit.id));
        fruits.push(...spawned);
      }
    }

    function handleMerges() {
      const merged = new Set();
      const toRemove = new Set();
      const toAdd = [];

      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (merged.has(a.id)) continue;
        if (a.kind !== "fruit") continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (merged.has(b.id)) continue;
          if (b.kind !== "fruit") continue;
          if (a.tier !== b.tier || a.tier >= FRUITS.length - 1) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = a.radius + b.radius;

          if (dist >= minDist) continue;

          const nx = (a.x + b.x) / 2;
          const ny = (a.y + b.y) / 2;
          const nextTier = a.tier + 1;

          merged.add(a.id);
          merged.add(b.id);
          toRemove.add(a.id);
          toRemove.add(b.id);
          const mergedFruit = createFruit(nextTier, nx, ny);
          // 고중력 성분은 다음 단계 과일로 병합된 뒤에도 유지된다.
          mergedFruit.gravityMultiplier = Math.max(a.gravityMultiplier, b.gravityMultiplier);
          toAdd.push(mergedFruit);

          createMergeEffect(nx, ny, nextTier);
          playMergeSound(nextTier);

          score += FRUITS[nextTier].score;
        }
      }

      if (toRemove.size > 0) {
        fruits = fruits.filter((f) => !toRemove.has(f.id));
        fruits.push(...toAdd);
        updateScoreUI();
      }
    }

    function resolveOverlaps() {
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = a.radius + b.radius;

          if (dist >= minDist) continue;

          // 완전히 같은 위치에 겹쳐서 생성된 경우, 거리 기반 방향 대신
          // 두 과일 id로 결정되는 고정 방향을 사용해 분리 방향이 매 프레임 흔들리지 않게 한다.
          let nx, ny, overlap;
          if (dist < 0.01) {
            const angle = ((a.id * 928371 + b.id * 6151) % 360) * (Math.PI / 180);
            nx = Math.cos(angle);
            ny = Math.sin(angle);
            overlap = minDist;
          } else {
            nx = dx / dist;
            ny = dy / dist;
            overlap = minDist - dist;
          }
          // 한 프레임에 순간이동하듯 튕기지 않도록 보정량 제한
          overlap = Math.min(overlap, MAX_CORRECTION_PER_STEP);

          const invMassA = 1 / (a.radius * a.radius);
          const invMassB = 1 / (b.radius * b.radius);
          const totalInv = invMassA + invMassB;

          a.x -= nx * overlap * (invMassA / totalInv);
          a.y -= ny * overlap * (invMassA / totalInv);
          b.x += nx * overlap * (invMassB / totalInv);
          b.y += ny * overlap * (invMassB / totalInv);

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const velAlongNormal = rvx * nx + rvy * ny;

          if (velAlongNormal > 0) continue;

          // 접촉 속도가 아주 작으면(쌓여서 정지한 상태) 반발을 주지 않아
          // 미세하게 계속 튕기며 settled 상태에 도달하지 못하는 것을 막는다.
          const restitution = gameMode === "bouncy"
            ? 0.96
            : (-velAlongNormal < 40 ? 0 : RESTITUTION);
          const j2 = (-(1 + restitution) * velAlongNormal) / totalInv;
          const impulseX = j2 * nx;
          const impulseY = j2 * ny;

          a.vx -= impulseX * invMassA;
          a.vy -= impulseY * invMassA;
          b.vx += impulseX * invMassB;
          b.vy += impulseY * invMassB;
        }
      }
    }

    function checkGameOver(dt) {
      for (const f of fruits) {
        if (f.settled && f.y - f.radius < LINE_Y) {
          f.dangerTime += dt;
          if (f.dangerTime > DANGER_TIME_LIMIT) {
            triggerGameOver();
            return;
          }
        } else {
          f.dangerTime = 0;
        }
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.textContent = score;
      gameOverEl.classList.remove("hidden");
    }

    // ---- 렌더링 ----

    function drawFruit(f) {
      const def = f.kind === "fruit" ? FRUITS[f.tier] : SPECIAL_BALLS[f.specialType];
      // 새 과일은 살짝 커졌다 제자리로 돌아오며 나타난다.
      const progress = Math.min(1, f.spawnAge / 0.22);
      const scale = progress < 1
        ? 1 + Math.sin(progress * Math.PI) * 0.18 - (1 - progress) * 0.35
        : 1;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(scale, scale);
      if (f.kind === "fruit" && f.gravityMultiplier > 1) {
        ctx.beginPath();
        ctx.arc(0, 0, f.radius + 7, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(108, 92, 231, 0.75)";
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
      ctx.fillStyle = def.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.stroke();

      ctx.font = `${f.radius}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(def.emoji, 0, 0);
      ctx.restore();
    }

    function drawEffects() {
      for (const effect of effects) {
        const progress = effect.age / effect.duration;
        ctx.save();
        ctx.globalAlpha = 1 - progress;
        if (effect.type === "ring") {
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, 10 + progress * 55, 0, Math.PI * 2);
          ctx.strokeStyle = effect.color;
          ctx.lineWidth = 6 * (1 - progress) + 1;
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, effect.radius * (1 - progress * 0.4), 0, Math.PI * 2);
          ctx.fillStyle = effect.color;
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawCurrentFruit() {
      if (isGameOver) return;
      const def = getDropDefinition(currentDrop);
      const radius = def.radius;
      const x = Math.max(radius, Math.min(W - radius, pointerX));
      const y = LINE_Y - radius - 10;

      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = def.color;
      ctx.fill();
      ctx.font = `${radius}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(def.emoji, x, y);
      ctx.globalAlpha = 1;
    }

    function drawLine() {
      ctx.beginPath();
      ctx.setLineDash([6, 6]);
      ctx.moveTo(0, LINE_Y);
      ctx.lineTo(W, LINE_Y);
      ctx.strokeStyle = "#e74c3c";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (screenShake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * screenShake * 2,
          (Math.random() - 0.5) * screenShake * 2
        );
      }
      drawLine();
      for (const f of fruits) drawFruit(f);
      drawEffects();
      drawCurrentFruit();
      ctx.restore();
    }

    // ---- 메인 루프 ----

    let lastTime = null;
    const FIXED_DT = 1 / 120;

    function loop(timestamp) {
      if (lastTime === null) lastTime = timestamp;
      let frameDt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      frameDt = Math.min(frameDt, 0.05); // 탭 전환 등으로 인한 큰 점프 방지
      updateEffects(frameDt);

      if (dropCooldownTimer > 0) dropCooldownTimer -= frameDt;

      if (!isGameOver) {
        let remaining = frameDt;
        while (remaining > 0) {
          const dt = Math.min(FIXED_DT, remaining);
          stepPhysics(dt);
          checkGameOver(dt);
          remaining -= dt;
        }
      }

      render();
      requestAnimationFrame(loop);
    }

    changeMode("normal");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
